services:
  api:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.api.rule=PathPrefix(`/api`) || Path(`/health`) || Path(`/ready`)
    #   - traefik.http.services.api.loadbalancer.server.port=5000

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.web.rule=PathPrefix(`/`)
    #   - traefik.http.services.web.loadbalancer.server.port=80
